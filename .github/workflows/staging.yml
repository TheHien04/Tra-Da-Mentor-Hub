# Staging CD — requires a real deployment command and verifies the deployed API.
name: Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy and verify staging
        env:
          STAGING_DEPLOY_COMMAND: ${{ secrets.STAGING_DEPLOY_COMMAND }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_DEPLOY_COMMAND" ] || [ -z "$STAGING_URL" ]; then
            echo "Staging deploy requires STAGING_DEPLOY_COMMAND secret and STAGING_URL variable." >&2
            exit 1
          fi
          bash -euo pipefail -c "$STAGING_DEPLOY_COMMAND"
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 "${STAGING_URL%/}/api/ready")"
          echo "$response" | jq -e '.status == "ok" and .storage == "mongodb"' > /dev/null
